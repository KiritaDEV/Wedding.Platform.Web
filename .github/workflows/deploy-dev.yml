name: Deploy DEV Web

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - kirita-dev-web

    steps:
      - name: Verify DEV Web fetch access
        shell: powershell
        run: |
          $git = "C:\Program Files\Git\cmd\git.exe"
          $repo = "C:\Kirita\dev\web"

          & $git -C $repo fetch origin develop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Currently deployed:"
          & $git -C $repo rev-parse HEAD

          Write-Host "Latest origin/develop:"
          & $git -C $repo rev-parse origin/develop
